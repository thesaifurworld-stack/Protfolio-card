@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1010;--sf:#2b1717;--tx:#fdeaea;--mu:#d3aaaa;--br:#ff4d42;--bi:#fff;--ac:#ff6a5e;--ln:#442424;--cg:#3a2316}}
:root[data-theme="dark"]{--bg:#1c1010;--sf:#2b1717;--tx:#fdeaea;--mu:#d3aaaa;--br:#ff4d42;--bi:#fff;--ac:#ff6a5e;--ln:#442424;--cg:#3a2316}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 110px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Poppins','Hind Siliguri',system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#e10600;z-index:30}
h1,h2,h3{font-family:'Poppins','Hind Siliguri',system-ui,sans-serif;margin:0}
.w{max-width:760px;margin:0 auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,#e10600,#b00008);border-bottom:3px solid var(--yl);color:#fff}
.bar{display:flex;align-items:center;gap:8px;padding:8px 0}
.logo{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.1rem;color:var(--yl);background:#f00;padding:6px 12px;border-radius:6px;margin-right:auto;text-decoration:none;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ib{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer}
nav{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;white-space:nowrap}
nav a{color:#ffe9e6;text-decoration:none;font-weight:600}
.hero{position:relative;margin:0 -16px 44px;padding:34px 16px 46px;background:linear-gradient(160deg,#ff1f1f 0%,#c4000d 55%,#a30008 100%);color:#fff}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-24px;height:24px;background:radial-gradient(circle at 24px 0,#a30008 23px,transparent 24px) 0 0/48px 24px repeat-x}
.hero h1{font-size:clamp(1.9rem,8vw,3rem);line-height:1.2;font-weight:800;color:#fff}
.hero p{color:#ffe9e6;max-width:38ch}
.btn{display:inline-block;background:var(--br);color:var(--bi);padding:12px 20px;border-radius:999px;font:inherit;font-weight:700;border:2px solid var(--br);text-decoration:none;cursor:pointer;margin:6px 6px 0 0}
.btn.o{background:transparent;color:var(--br)}
.hero .btn{background:var(--yl);color:#3b2a00;border-color:var(--yl)}
.hero .btn.o{background:transparent;color:#fff;border-color:#fff}
h2{font-size:1.45rem;font-weight:700;margin:30px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;background:var(--sf);border:1px solid var(--ln);color:var(--tx);border-radius:999px;padding:6px 13px;font:inherit;cursor:pointer}
.chip.on{background:var(--br);color:var(--bi);border-color:var(--br)}
.lab{font-weight:700;color:var(--mu);font-size:.85rem;margin:8px 0 4px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(180deg,var(--sf) 40%,var(--cg));border:1px solid var(--ln);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.pic{margin:8px;border-radius:16px;height:104px;display:flex;align-items:center;justify-content:center;font-size:3.2rem;transition:transform .3s}
.card:hover .pic{transform:scale(1.08)}
.pw{overflow:hidden}
.inf{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.inf h3{font-size:1rem}
.pr{font-size:1.15rem;font-weight:800;color:var(--br)}
input,select,textarea{font:inherit;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);width:100%}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;display:grid;gap:10px}
.st{font-weight:700;color:var(--br)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rv{display:grid;gap:10px}
.rv div{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px}
footer{margin-top:34px;padding:24px 16px 40px;text-align:center;color:#ffe9e6;background:linear-gradient(180deg,#c4000d,#a30008);border-top:3px solid var(--yl)}
footer a{color:var(--yl);font-weight:600}
.sig{margin-top:12px;font-size:.85rem}
#dr{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none}
#dr.on{display:block}
#pn{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:10px;align-content:start}
.li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--ln);padding:6px 0}
.x{background:none;border:0;color:var(--br);font:inherit;font-weight:700;cursor:pointer}
.ck{display:flex;align-items:center;gap:8px}.ck input{width:auto}
.tot{font-size:1.2rem;font-weight:700}
.nt{color:var(--mu);font-size:.85rem;margin:0}
.eb{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem;margin-bottom:6px}
.ftg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.ft{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:14px 10px;font-weight:700;font-size:.9rem;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.cats{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px}
.cat{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.cat i{font-style:normal;font-size:1.8rem;width:66px;height:66px;border-radius:50%;background:var(--cg);border:0;box-shadow:0 3px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.hc{flex:0 0 150px}
.fb{color:var(--br);font-size:.78rem;font-weight:600}
.fw{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:25;background:#25d366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
[hidden]{display:none!important}
#go{background:#25d366;border-color:#25d366;color:#fff}
.rv div{border-radius:20px;padding:16px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.wa-s{display:block;font-size:.72rem;font-weight:600;opacity:.85;line-height:1.1}
.fw.fc{bottom:calc(env(safe-area-inset-bottom,0px) + 82px);background:var(--br);border:0;cursor:pointer}
#q{border-radius:999px;padding:12px 18px;border:2px solid var(--ln)}
.sl{position:relative;height:120px;border-radius:20px;background:var(--br);color:var(--bi);margin-top:14px;overflow:hidden}
.sld{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.4rem;opacity:0;transition:opacity .6s;text-align:center}
.sld span{font-size:1rem;font-weight:700}
.sld.on{opacity:1}
.lgi{display:inline-block;width:44px;height:44px;border-radius:50%;background:var(--logo) center/cover;border:2px solid var(--yl);flex:0 0 auto}
.logo{display:flex;align-items:center;gap:8px;background:none!important;box-shadow:none!important;padding:0!important;color:#fff!important}
.logo b{font-weight:800;font-size:1.05rem;color:var(--yl)}
.abl{width:min(260px,70%);aspect-ratio:1;border-radius:24px;background:var(--logo) center/cover;margin:6px auto 12px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.sig{font-size:.6rem!important;opacity:.55;margin-top:14px}

.cp{display:block;width:calc(100% - 16px);aspect-ratio:1;object-fit:cover;margin:8px;border-radius:16px;cursor:zoom-in;transition:transform .3s}
.card:hover .cp{transform:scale(1.04)}
.pw{overflow:hidden}

 fillSel("tm",SL);fillSel("pay",PAY.map(function(p){return p=="cod"?t("cod"):p}));
 $("ao").innerHTML=ADDONS.map(function(a,i){return'<label class="ck"><input type="checkbox" class="aoc" value="'+i+'"> '+a[L=="bn"?1:0]+' (৳'+a[2]+')</label>'}).join("");
 bp();drawCart();
}
function bp(){var b=BASES[$("b1").value||0];$("bp").textContent=t("tot")+": ৳"+(b[2]*SZ[$("b2").value||0]+FR[$("b3").value||0])}
function addons(){var s=0,n=[];document.querySelectorAll(".aoc:checked").forEach(function(c){var a=ADDONS[c.value];s+=a[2];n.push(a[0])});return{s:s,n:n}}
function cartSum(){var s=0;cart.forEach(function(c){s+=c.price});return s}
function drawCart(){
 $("cn").textContent=cart.length;
 $("ci").innerHTML=cart.length?cart.map(function(c,i){return'<div class="li"><div>'+c.label+'<br><small>'+c.sub+'</small></div><div>৳'+c.price+'<br><button class="x" type="button" data-rm="'+i+'">'+t("rm")+'</button></div></div>'}).join(""):'<p class="nt">'+t("empty")+'</p>';
 $("tt").textContent=t("tot")+": ৳"+(cartSum()+addons().s);
}
function addCake(i,w){var k=ALL[i];cart.push({label:nm(k),sub:w+" "+t("lb"),price:k.p*w,txt:k.en+" "+w+" lb"});drawCart();toast(t("added"))}
function showLB(){var k=ALL[LB.c];$("li").src=pic(k,LB.i);$("lt").textContent=nm(k)+" · ৳"+k.p+"/"+t("lb");$("lo").textContent=t("orderthis")}
function openCart(){$("dr").classList.add("on")}

document.addEventListener("click",function(e){
 var z=e.target.closest("[data-zoom]");if(z){LB.c=+z.dataset.zoom;LB.i=0;showLB();$("lb").classList.add("on");return}
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.ck){F={o:"all",f:"all"};if(b.dataset.ck!="r")F[b.dataset.ck]=b.dataset.cv;$("q").value="";render();$("dsg").scrollIntoView();return}
 if(b.dataset.k){F[b.dataset.k]=b.dataset.v;render();return}
 if(b.dataset.add!==undefined){addCake(+b.dataset.add,+$("w"+b.dataset.add).value);return}
 if(b.dataset.rm!==undefined){cart.splice(+b.dataset.rm,1);drawCart()}
});
document.addEventListener("change",function(e){if(e.target.classList.contains("aoc"))drawCart();if(/^b[123]$/.test(e.target.id))bp()});
$("lx").onclick=function(){$("lb").classList.remove("on")};
$("lb").onclick=function(e){if(e.target.id=="lb")$("lb").classList.remove("on")};
$("lp").onclick=function(){var n=cnt(ALL[LB.c]);LB.i=(LB.i+n-1)%n;showLB()};
$("ln").onclick=function(){var n=cnt(ALL[LB.c]);LB.i=(LB.i+1)%n;showLB()};
$("lo").onclick=function(){addCake(LB.c,1);$("lb").classList.remove("on")};
$("ba").onclick=function(){
 var bs=BASES[$("b1").value],sz=SZ[$("b2").value],fi=$("b3").value,tx=$("b4").value,ph=$("b5").files.length?" + photo":"";
 cart.push({label:t("cu")+": "+nm({en:bs[0],bn:bs[1]}),sub:sz+" "+t("lb")+", "+[t("bcr"),t("wcr"),t("fon")][fi]+(tx?', "'+tx+'"':""),price:bs[2]*sz+FR[fi],txt:"CUSTOM "+bs[0]+" "+sz+" lb, "+["Buttercream","Whipped cream","Fondant"][fi]+(tx?", text: "+tx:"")+ph});
 drawCart();toast(t("added"));openCart()};
$("ct").onclick=openCart;$("fc").onclick=openCart;
$("cl").onclick=function(){$("dr").classList.remove("on")};
$("dr").onclick=function(e){if(e.target.id=="dr")$("dr").classList.remove("on")};
$("lg").onclick=function(){L=L=="bn"?"en":"bn";render();if($("lb").classList.contains("on"))showLB()};
$("q").oninput=render;
function msg(x){var e=$("er");e.textContent=x;e.hidden=false}
$("go").onclick=function(){
 $("er").hidden=true;
 if(!cart.length){msg(t("empty"));return}
 if(!$("nm").value||!$("ph").value||!$("adr").value||!$("dt").value){msg(t("fill"));return}
 var a=addons();
 var m="*NEW CAKE ORDER – Flavour Fantasy*\nName: "+$("nm").value+"\nPhone: "+$("ph").value+"\nAddress: "+$("adr").value+"\nDelivery: "+$("dt").value+", "+SL[$("tm").value]+"\nPayment: "+($("pay").value==4?"Cash on delivery":PAY[$("pay").value])+"\n\nItems:\n"+cart.map(function(c){return"- "+c.txt+" (৳"+c.price+")"}).join("\n")+(a.n.length?"\nAdd-ons: "+a.n.join(", "):"")+"\n\nTotal: ৳"+(cartSum()+a.s);
 var u="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m);
 $("rs").hidden=false;$("rl").href=u;$("rt").value=m.replace(/\*/g,"");
 try{window.open(u,"_blank")}catch(x){}
 $("rs").scrollIntoView({block:"center"});
};
$("cp").onclick=function(){var r=$("rt");r.select();try{navigator.clipboard.writeText(r.value)}catch(x){}try{document.execCommand("copy")}catch(x){}toast("✓")};
var d=new Date();d.setDate(d.getDate()+1);$("dt").min=d.toISOString().slice(0,10);
$("wa").href="https://wa.me/"+WHATSAPP;$("fw").href="https://wa.me/"+WHATSAPP;
$("sl").innerHTML=[13,2,11,9,8,3].map(function(n,i){return'<img class="sp'+(i?'':' on')+'" src="'+IM[n]+'" alt="">'}).join("");
var si=0,sd=document.querySelectorAll(".sp");setInterval(function(){sd[si].classList.remove("on");si=(si+1)%sd.length;sd[si].classList.add("on")},3000);
render();
</script>
</body>
</html>
